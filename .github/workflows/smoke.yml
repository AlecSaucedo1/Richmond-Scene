name: Bulletin smoke check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py promotion_app.py bulletin
      - name: Import production app
        run: python -c "import promotion_app; assert promotion_app.app.title == 'The San Francisco Bulletin'; print('production app import ok')"
