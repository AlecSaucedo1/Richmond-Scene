services:
  - type: web
    name: sf-neighborhood-bulletin
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATASF_BASE_URL
        value: https://data.sfgov.org/resource
      - key: REFRESH_TIMEZONE
        value: America/Los_Angeles
      - key: MORNING_REFRESH_HOUR
        value: "7"
      - key: EVENING_REFRESH_HOUR
        value: "18"
      - key: ATTOM_API_KEY
        sync: false
      - key: REALESTATE_LOOKBACK_DAYS
        value: "45"
      - key: REALESTATE_MAX_PAGES
        value: "8"
      - key: REALESTATE_PAGE_SIZE
        value: "100"
      - key: CACHE_PATH
        value: /var/data/bulletin-cache.json
      - key: DATASF_APP_TOKEN
        sync: false
    disk:
      name: sf-neighborhood-bulletin-data
      mountPath: /var/data
      sizeGB: 1
