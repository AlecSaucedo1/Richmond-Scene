services:
  - type: web
    name: sf-neighborhood-bulletin
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATASF_BASE_URL
        value: https://data.sfgov.org/resource
      - key: REFRESH_INTERVAL_HOURS
        value: "6"
      - key: CACHE_PATH
        value: /var/data/bulletin-cache.json
      - key: DATASF_APP_TOKEN
        sync: false
    disk:
      name: sf-neighborhood-bulletin-data
      mountPath: /var/data
      sizeGB: 1
