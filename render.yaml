services:
  - type: web
    name: sf-neighborhood-bulletin
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATASF_BASE_URL
        value: https://data.sfgov.org/resource
      - key: PUBLIC_BASE_URL
        value: https://sf-neighborhood-bulletin.onrender.com
      - key: INDEXNOW_KEY
        value: 8f4f7d5a4d964687aaf4730f4ca67826
      - key: REFRESH_TIMEZONE
        value: America/Los_Angeles
      - key: MORNING_REFRESH_HOUR
        value: "7"
      - key: EVENING_REFRESH_HOUR
        value: "18"
      - key: REALESTATE_COMMERCIAL_ARTICLES
        value: "14"
      - key: CACHE_PATH
        value: /var/data/bulletin-cache.json
      - key: BULLETIN_BRIEF_AUDIO_PATH
        value: /var/data/bulletin-brief.mp3
      - key: BULLETIN_TTS_MODEL
        value: gpt-audio-1.5
      - key: BULLETIN_TTS_VOICE
        value: marin
      - key: BULLETIN_TTS_FORMAT
        value: mp3
      - key: BULLETIN_TTS_TIMEOUT_SECONDS
        value: "60"
      - key: BULLETIN_LONGREAD_MODEL
        value: gpt-5.6-terra
      - key: BULLETIN_LONGREAD_TIMEOUT_SECONDS
        value: "90"
      - key: BULLETIN_LONGREAD_CONCURRENCY
        value: "5"
      - key: BULLETIN_LONGREAD_MAX_OUTPUT_TOKENS
        value: "5000"
      - key: DATASF_APP_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: sf-neighborhood-bulletin-data
      mountPath: /var/data
      sizeGB: 1
